# CI — check.sh がローカルと CI の唯一の検証入口(README「CI runs the same
# script」、tests/test_packaging.py の SingleCheckEntrypointTest が固定)。
# ここに独自のチェックを並べ直さないこと。check.sh を迂回する層を作らない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 回帰ジョブ。統合テスト込みの全層(~25s)。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh

  # 変異監査。ガード(テスト)自体が生きているかの棚卸し(~2.5min)。
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh --mutants
